spring.datasource.url=${SHOPFLOW_DB_URL:jdbc:postgresql://localhost:5432/shopflow}
spring.datasource.username=${SHOPFLOW_DB_USERNAME:postgres}
spring.datasource.password=${SHOPFLOW_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
